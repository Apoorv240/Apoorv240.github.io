<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apoorv Agrawal — Portfolio (Markdown demo)</title>

  <!-- Marked (markdown parser) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Optional icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- your custom css -->
  <link rel="stylesheet" href="../../style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand custom-brand" href="../../#">~apoorv240.github.io</a>
    <button
      class="navbar-toggler custom-toggler"
      type="button"
      data-bs-toggle="offcanvas"
      data-bs-target="#mobileNav"
      aria-controls="mobileNav"
      aria-label="Toggle navigation"
      aria-expanded="false">
      <span class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="mobileNav" aria-labelledby="mobileNavLabel">
      <div class="offcanvas-header">
        <h5 id="mobileNavLabel" class="offcanvas-title">Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link slide-link" href="../../#about-experience">About</a></li>
          <li class="nav-item"><a class="nav-link slide-link" href="../../#projects">Projects</a></li>
          <li class="nav-item"><a class="nav-link slide-link" href="../../#contact">Contact</a></li>
        </ul>
      </div>
    </div>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="../../#about-experience">About</a></li>
        <li class="nav-item"><a class="nav-link" href="../../#projects">Projects</a></li>
        <li class="nav-item"><a class="nav-link" href="../../#contact">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<section class="container my-5">
  <!-- Keep markdown in a script[type="text/plain"] so formatting is preserved -->
  <script id="markdown-content" type="text/plain">
# My Markdown Heading

- Item one
- Item two

**Bold text**, `inline code`, and a [link](https://example.com).
  </script>

  <!-- Where the parsed HTML will go -->
  <div id="output" class="mt-3"></div>
</section>

<!-- Bootstrap JS bundle (includes Popper). Put before any code that uses `bootstrap` -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>

<!-- Your initialization scripts -->
<script>
  // Wait for DOM + libraries to be ready.
  // `defer` on the external scripts above ensures they load before DOMContentLoaded fires.
  document.addEventListener('DOMContentLoaded', function () {
    // --- Render markdown with marked ---
    const markdownText = document.getElementById('markdown-content').textContent;
    // Use marked.parse (or marked.parseInline) to convert to HTML
    document.getElementById('output').innerHTML = marked.parse(markdownText);

    // --- Bootstrap offcanvas toggler accessibility sync ---
    // Get toggler button and offcanvas instance
    const toggler = document.querySelector('.navbar-toggler.custom-toggler');
    const offcanvasEl = document.getElementById('mobileNav');

    // Acquire bootstrap Offcanvas instance (bootstrap must be loaded)
    const offcanvasInstance = bootstrap.Offcanvas.getOrCreateInstance(offcanvasEl);

    offcanvasEl.addEventListener('show.bs.offcanvas', function () {
      toggler.setAttribute('aria-expanded', 'true');
    });
    offcanvasEl.addEventListener('hide.bs.offcanvas', function () {
      toggler.setAttribute('aria-expanded', 'false');
    });
  });
</script>

</body>
</html>
